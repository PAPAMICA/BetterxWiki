<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Better xWiki</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        color: #1d1d1f;
      }

      body {
        margin: 0;
        width: 340px;
        max-height: 560px;
        overflow: auto;
        background: #f5f5f7;
        -webkit-font-smoothing: antialiased;
      }

      header {
        position: sticky;
        top: 0;
        padding: 16px 16px 12px;
        background: rgba(255, 255, 255, 0.86);
        border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        backdrop-filter: saturate(180%) blur(16px);
      }

      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 650;
      }

      header p {
        margin: 4px 0 0;
        color: #6e6e73;
        font-size: 12px;
        line-height: 1.4;
      }

      h2 {
        margin: 8px 4px 0;
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #6e6e73;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px;
      }

      label.feature {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 10px;
        background: #fff;
        border: 1px solid rgba(0, 0, 0, 0.06);
        border-radius: 12px;
        cursor: pointer;
      }

      label.feature:hover {
        border-color: #cfd6e0;
      }

      input {
        margin-top: 2px;
        accent-color: #0071e3;
      }

      .text {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      strong {
        font-size: 13px;
        font-weight: 600;
      }

      small {
        color: #6e6e73;
        font-size: 12px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Better xWiki</h1>
      <p>Chaque fonction s’active séparément, y compris sur un onglet déjà ouvert.</p>
    </header>
    <form id="features"></form>
    <script type="module" src="popup.js"></script>
  </body>
</html>
